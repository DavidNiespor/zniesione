<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zniesione.pl – jaja prosto od rolnika</title>
<style>
:root{--bg:#eef1ec;--sf:#fff;--tx:#1b2a24;--mu:#5d6b64;--ln:#d5dbd3;--ac:#f0b400;--on:#1b2a24;--hd:#1e3a2f;--hdt:#f4f7f2;--ok:#1f7a4a;--no:#b3392f;--wa:#8a6100;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1511;--sf:#18221d;--tx:#e8eee9;--mu:#9aa89f;--ln:#2b3a32;--hd:#0a120e;--ok:#5cc28a;--no:#f0847a;--wa:#e8b94a;color-scheme:dark}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--hd);color:var(--hdt);display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding:.7rem 1rem}
.brand{font-size:1.5rem;font-weight:800}.brand span{color:var(--ac)}
#nav{display:flex;gap:.4rem;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;padding:.45rem .85rem;min-height:44px}
header button{background:transparent;color:var(--hdt);border-color:#ffffff40}
button:disabled{opacity:.5;cursor:default}
.pri,button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:1rem}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem);margin:.2rem 0 .8rem}h3{margin:.1rem 0 .3rem}h4{margin:1rem 0 .3rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:1rem;margin-bottom:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.9rem}.grid .card{margin:0}
.mu{color:var(--mu);font-size:.92rem}.ok{color:var(--ok)}.no{color:var(--no)}.wa{color:var(--wa)}
.price{font-size:1.4rem;font-weight:800;margin:.3rem 0}
.pill{border:1px solid var(--ln);border-radius:99px;padding:.05rem .6rem;font-size:.8rem;color:var(--mu);font-weight:400}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:.4rem .6rem;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:.9rem;color:var(--mu);margin:.6rem 0 .15rem}
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:.9rem}
.row2{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;border-top:1px solid var(--ln);padding:.6rem 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.3rem;border-bottom:1px solid var(--ln)}td input,td select{min-width:110px}
pre{overflow-x:auto;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:.7rem;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hd);color:var(--hdt);padding:.7rem 1.1rem;border-radius:10px;opacity:0;pointer-events:none;max-width:90%;z-index:9}
#toast.s{opacity:1}#toast.bad{background:var(--no);color:#fff}
</style></head><body>
<header><div class="brand">zniesione<span>.pl</span></div><nav id="nav" aria-label="Menu"></nav></header>
<main id="main"></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KINDS=['light','door_open','door_close','vent','heater','water_heater','valve','pump','feeder','other'],TH=['vent','heater','water_heater'];
let me=null,view='shop',tab='orders',atab='dev',orderFor=null,shopQ='';
async function api(m,u,b,h){const r=await fetch(u,{method:m,headers:{'X-Requested-With':'zniesione',...(b?{'Content-Type':'application/json'}:{}),...h},body:b?JSON.stringify(b):undefined});
 const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){d=t}return{ok:r.ok,status:r.status,data:d}}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className=bad?'bad s':'s';setTimeout(()=>e.className='',3500)}
const res=(r,okMsg)=>{if(r.ok){if(okMsg)toast(okMsg);return true}toast(r.data&&r.data.error||'Błąd '+r.status,true);return false};
const fd=f=>Object.fromEntries(new FormData(f));
const fld=(l,n,t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" ${x}></label>`;
const sel=(l,n,o)=>`<label>${l}<select name="${n}">${o.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select></label>`;
const main=h=>{$('#main').innerHTML=h};
function nav(){let h='<button data-act="go" data-v="shop">Sklep</button>';
 if(!me)h+='<button data-act="go" data-v="auth">Zaloguj / Zarejestruj</button>';
 else h+=(me.role=='admin'?'<button data-act="go" data-v="admin">Admin</button>':'<button data-act="go" data-v="farmer">Panel rolnika</button>')+`<button data-act="logout">Wyloguj (${esc(me.email)})</button>`;
 $('#nav').innerHTML=h}
async function render(){nav();if(view=='shop')await shop();else if(view=='auth')auth();else if(view=='farmer'&&me)await farmer();else if(view=='admin'&&me)await admin();else{view='auth';auth()}}
async function shop(){const r=await api('GET','/api/farms?q='+encodeURIComponent(shopQ));
 let h=`<h1>Jaja prosto od rolnika</h1><label>Kod pocztowy lub miejscowość<input id="q" value="${esc(shopQ)}" placeholder="np. 45-120"></label><div class="grid" id="farms" style="margin-top:1rem">`;
 for(const f of r.data)h+=`<div class="card" data-farm="${f.id}"><h3>${esc(f.name)}</h3><p class="mu">${esc(f.zip)} ${esc(f.city)} · ${esc(f.breed)}</p><p>${esc(f.descr)}</p><p class="price">${f.price10.toFixed(2)} zł <span class="mu">za 10 szt.</span></p><p class="mu">Dostępne: ${f.stock} opak.</p><button class="pri" data-act="order" data-id="${f.id}" ${f.stock<1?'disabled':''}>${f.stock<1?'Brak jaj':'Zamów'}</button></div>`;
 h+='</div>'+(r.data.length?'':'<p class="mu">Brak gospodarstw dla tego wyszukiwania.</p>');
 if(orderFor)h+=`<div class="card" id="orderbox" style="margin-top:1rem"><h3>Zamówienie</h3><form data-f="order">${fld('Imię i nazwisko','name','text','required')}${fld('Telefon','phone','tel','required')}${fld('Ilość opakowań (10 szt.)','qty','number','min="1" max="50" value="1" required')}${sel('Rodzaj','mode',[['once','Jednorazowe'],['weekly','Co tydzień'],['biweekly','Co 2 tygodnie']])}${sel('Odbiór','pickup',[['pickup','Odbiór osobisty'],['delivery','Dowóz rolnika']])}<p class="mu">Zamówienie jest wiążące po potwierdzeniu przez rolnika. Płatność przy odbiorze.</p><button class="pri">Wyślij zamówienie</button> <button type="button" data-act="cancelorder">Anuluj</button></form></div>`;
 main(h)}
function auth(){main(`<h1>Konto rolnika</h1><div class="grid"><div class="card"><h3>Logowanie</h3><form data-f="login">${fld('E-mail','email','email','required')}${fld('Hasło','password','password','required')}<p><button class="pri">Zaloguj</button></p></form></div><div class="card"><h3>Rejestracja gospodarstwa</h3><form data-f="register">${fld('E-mail','email','email','required')}${fld('Hasło (min. 8 znaków)','password','password','required minlength="8"')}${fld('Nazwa gospodarstwa','farm_name','text','required')}${fld('Miejscowość','city')}${fld('Kod pocztowy','zip')}<p><button class="pri">Załóż konto</button></p></form></div></div>`)}
const TABS=(a,l,cur)=>`<div class="tabs">${l.map(([k,t])=>`<button data-act="${a}" data-v="${k}" class="${k==cur?'on':''}">${t}</button>`).join('')}</div>`;
async function farmer(){let h='<h1>Panel rolnika</h1>'+TABS('tab',[['orders','Zamówienia'],['offer','Oferta'],['dev','Sterowniki']],tab);
 if(tab=='orders'){const r=await api('GET','/api/my/orders');h+='<div class="card"><h3>Zamówienia klientów</h3>'+(r.data.map(o=>`<div class="row2" data-order="${o.id}"><div><b>${esc(o.name)}</b> · ${esc(o.phone)} · ${o.qty} opak. · ${o.total.toFixed(2)} zł<br><span class="mu">${{once:'Jednorazowe',weekly:'Co tydzień',biweekly:'Co 2 tygodnie'}[o.mode]} · ${o.pickup=='pickup'?'odbiór':'dowóz'}</span></div><div>${o.status=='pending'?`<button class="pri" data-act="confirm" data-id="${o.id}">Potwierdź</button> <button data-act="reject" data-id="${o.id}">Odrzuć</button>`:`<b class="${o.status=='confirmed'?'ok':'no'}">${o.status=='confirmed'?'Potwierdzone':'Odrzucone'}</b>`}</div></div>`).join('')||'<p class="mu">Brak zamówień.</p>')+'</div>'}
 else if(tab=='offer'){const f=(await api('GET','/api/farms/'+me.farm_id)).data;h+=`<div class="card"><h3>Oferta i dane gospodarstwa</h3><form data-f="offer">${fld('Nazwa','name','text',`value="${esc(f.name)}" required`)}${fld('Miejscowość','city','text',`value="${esc(f.city)}"`)}${fld('Kod pocztowy','zip','text',`value="${esc(f.zip)}"`)}${fld('Rodzaj chowu','breed','text',`value="${esc(f.breed)}"`)}${fld('Opis','descr','text',`value="${esc(f.descr)}"`)}${fld('Cena za 10 szt. (zł)','price10','number',`step="0.5" min="0" value="${f.price10}"`)}${fld('Dostępne opakowania','stock','number',`min="0" value="${f.stock}"`)}<p><button class="pri">Zapisz</button></p></form></div>`}
 else{const [dv,ct]=await Promise.all([api('GET','/api/my/devices'),api('GET','/api/catalog')]);
  h+=`<div class="card"><h3>Zamów sterownik</h3><form data-f="devorder">${sel('Model','model',ct.data.map(m=>[m.id,m.name]))}${sel('Połączenie','tunnel',[['','Domyślne'],['wg','WireGuard'],['ts','Tailscale'],['mqtt','MQTT']])}${fld('Adres dostawy','addr','text','required')}<p><button class="pri">Zamów</button></p></form><p class="mu">Do portalu można podłączyć tylko sterowniki zakupione u operatora.</p></div>`;
  for(const d of dv.data){const sc=(await api('GET',`/api/my/devices/${d.id}/schedules`)).data;h+=devCard(d,sc)}}
 main(h)}
function devCard(d,sc){const live=d.stage>=3&&d.online;
 let h=`<div class="card" data-dev="${d.id}"><h3>${esc(d.code)} <span class="pill">${esc(d.model_name)}</span></h3><p class="mu">${esc(d.addr)} · ${d.tunnel} · ${d.ip} · <b class="${live?'ok':'wa'}">${live?'online':d.stage<3?'etap '+d.stage+'/3':'offline'}</b></p>`;
 if(d.reading)h+=`<p>Temperatura: <b class="temp">${d.reading.t??'–'} °C</b> · wilgotność: <b>${d.reading.h??'–'} %</b></p>`;
 if(d.stage>=1)h+=`<p><button data-act="yaml" data-id="${d.id}">Konfiguracja ESPHome</button></p><pre id="yaml${d.id}" hidden></pre>`;
 h+='<table><tr><th>Kanał</th><th>Nazwa</th><th>Rodzaj</th><th></th></tr>';
 for(const c of d.channels)h+=`<tr data-ch="${c.key}"><td>${c.key}</td><td><input class="nm" value="${esc(c.name)}"></td><td><select class="kd">${KINDS.map(k=>`<option ${k==c.kind?'selected':''}>${k}</option>`).join('')}</select></td><td><button data-act="savech" data-id="${d.id}" data-k="${c.key}">Zapisz</button> <button class="tg ${c.state?'on':''}" data-act="toggle" data-id="${d.id}" data-k="${c.key}" data-s="${c.state?1:0}" ${live?'':'disabled'}>${c.state?'Wyłącz':'Włącz'}</button></td></tr>`;
 h+='</table><h4>Harmonogramy</h4>'+sc.map(s=>`<div class="row2">${s.ch}: ${s.t_on}–${s.t_off} (${s.days}) <button data-act="delsch" data-id="${d.id}" data-sid="${s.id}">Usuń</button></div>`).join('');
 h+=`<form data-f="sched" data-id="${d.id}">${sel('Kanał','ch',d.channels.filter(c=>!c.kind.startsWith('door')).map(c=>[c.key,c.name]))}${fld('Włącz o','t_on','time','value="06:00" required')}${fld('Wyłącz o','t_off','time','value="18:00" required')}${sel('Dni','days',[['a','Codziennie'],['w','Pn–Pt'],['e','Weekend']])}<p><button>Dodaj harmonogram</button></p></form>`;
 for(const c of d.channels.filter(c=>TH.includes(c.kind)))h+=`<form data-f="rule" data-id="${d.id}" data-k="${c.key}"><h4>Termostat: ${esc(c.name)} (${c.kind=='vent'?'włącz powyżej':'włącz poniżej'} progu)</h4>${fld('Próg (°C)','threshold','number','step="0.5" value="25" required')}<label><input type="checkbox" name="enabled" checked style="width:auto;min-height:0"> aktywny</label><p><button>Zapisz termostat</button></p></form>`;
 return h+'</div>'}
async function admin(){let h='<h1>Administrator</h1>'+TABS('atab',[['dev','Sterowniki'],['cfg','Konfiguracja'],['tools','Narzędzia']],atab);
 if(atab=='dev'){const [dv,fm,ct]=await Promise.all([api('GET','/api/admin/devices'),api('GET','/api/farms'),api('GET','/api/catalog')]);
  const fo=fm.data.map(f=>[f.id,f.name]);
  h+=`<div class="card"><h3>Dodaj sterownik do farmy</h3><form data-f="adddev">${sel('Model','model',ct.data.map(m=>[m.id,m.name]))}${sel('Farma','farm_id',fo)}${fld('Adres lub opis','addr')}<p><button class="pri">Dodaj</button></p></form></div>`;
  for(const d of dv.data)h+=`<div class="card" data-dev="${d.id}"><h3>${esc(d.code)} <span class="pill">${esc(d.model_name)}</span></h3><p class="mu">${d.tunnel} · ${d.ip} · etap ${d.stage}/3 · ${d.online?'online':'offline'} · klucz API: <code>${esc(d.api_key)}</code></p><div class="row2"><div><select class="fm">${fo.map(([v,t])=>`<option value="${v}" ${v==d.farm_id?'selected':''}>${esc(t)}</option>`).join('')}</select></div><button data-act="assign" data-id="${d.id}">Przypisz do farmy</button><button data-act="stage" data-id="${d.id}" data-s="${d.stage}" ${d.stage>=3?'disabled':''}>Następny etap</button></div><form data-f="reading" data-key="${esc(d.api_key)}"><div class="row2">${fld('Temp. (°C)','t','number','step="0.1" value="21"')}${fld('Wilgotność (%)','h','number','value="60"')}<button>Wyślij odczyt (test)</button></div></form></div>`}
 else if(atab=='cfg'){const c=(await api('GET','/api/admin/config')).data;h+=`<div class="card"><h3>Tunel WireGuard</h3><form data-f="cfg">${fld('Adres serwera','wg_endpoint','text',`value="${esc(c.wg_endpoint)}"`)}${fld('Port','wg_port','text',`value="${esc(c.wg_port)}"`)}${fld('Podsieć (3 oktety)','net','text',`value="${esc(c.net)}"`)}<p><button class="pri">Zapisz</button></p></form></div>`}
 else h+='<div class="card"><h3>Silnik harmonogramów i termostatu</h3><p class="mu">Uruchamia jeden obieg: porównuje stan pożądany z faktycznym i wysyła różnice do urządzeń.</p><button class="pri" data-act="tick">Uruchom silnik teraz</button><pre id="tickout" hidden></pre></div>';
 main(h)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
 if(a=='go'){view=d.v;orderFor=null;await render()}
 else if(a=='tab'){tab=d.v;await render()}else if(a=='atab'){atab=d.v;await render()}
 else if(a=='order'){orderFor=+d.id;await render();$('#orderbox').scrollIntoView&&$('#orderbox').scrollIntoView()}
 else if(a=='cancelorder'){orderFor=null;await render()}
 else if(a=='logout'){await api('POST','/api/auth/logout');me=null;view='shop';await render()}
 else if(a=='confirm'||a=='reject'){if(res(await api('POST',`/api/my/orders/${d.id}/${a}`),a=='confirm'?'Zamówienie potwierdzone':'Zamówienie odrzucone'))await render()}
 else if(a=='toggle'){if(res(await api('POST',`/api/my/devices/${d.id}/channels/${d.k}`,{state:d.s!='1'}),'Polecenie wykonane'))await render()}
 else if(a=='savech'){const tr=b.closest('tr');if(res(await api('PATCH',`/api/my/devices/${d.id}/channels/${d.k}`,{name:tr.querySelector('.nm').value,kind:tr.querySelector('.kd').value}),'Zapisano'))await render()}
 else if(a=='delsch'){if(res(await api('DELETE',`/api/my/devices/${d.id}/schedules/${d.sid}`)))await render()}
 else if(a=='yaml'){const p=$('#yaml'+d.id);if(p.hidden){const r=await api('GET',`/api/my/devices/${d.id}/yaml`);p.textContent=typeof r.data=='string'?r.data:(r.data.error||'Błąd');p.hidden=false}else p.hidden=true}
 else if(a=='assign'){if(res(await api('PATCH',`/api/admin/devices/${d.id}`,{farm_id:+b.closest('.card').querySelector('.fm').value}),'Przypisano'))await render()}
 else if(a=='stage'){if(res(await api('PATCH',`/api/admin/devices/${d.id}`,{stage:+d.s+1}),'Etap zwiększony'))await render()}
 else if(a=='tick'){const r=await api('POST','/api/admin/tick');if(res(r,'Silnik uruchomiony')){const p=$('#tickout');p.textContent=JSON.stringify(r.data.sent);p.hidden=false}}});
document.addEventListener('input',async e=>{if(e.target.id=='q'){shopQ=e.target.value;await shop();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,k=f.dataset.f,v=fd(f),d=f.dataset;
 if(k=='order'){if(res(await api('POST',`/api/farms/${orderFor}/orders`,{...v,qty:+v.qty}))){const o=(await api('GET','/api/farms/'+orderFor));orderFor=null;toast('Zamówienie wysłane. Czeka na potwierdzenie rolnika.');await render()}}
 else if(k=='login'||k=='register'){const r=await api('POST','/api/auth/'+k,v);if(res(r)){me=(await api('GET','/api/me')).data;view=me.role=='admin'?'admin':'farmer';tab='orders';await render()}}
 else if(k=='offer'){if(res(await api('PUT','/api/my/farm',{...v,price10:+v.price10,stock:+v.stock}),'Zapisano ofertę'))await render()}
 else if(k=='devorder'){if(res(await api('POST','/api/my/device-orders',{model:v.model,tunnel:v.tunnel||undefined,addr:v.addr}),'Zamówienie sterownika złożone'))await render()}
 else if(k=='sched'){if(res(await api('POST',`/api/my/devices/${d.id}/schedules`,v),'Harmonogram dodany'))await render()}
 else if(k=='rule'){if(res(await api('PUT',`/api/my/devices/${d.id}/rules/${d.k}`,{threshold:+v.threshold,enabled:'enabled' in v}),'Termostat zapisany'))await render()}
 else if(k=='adddev'){if(res(await api('POST','/api/admin/devices',{model:v.model,farm_id:+v.farm_id,addr:v.addr}),'Sterownik dodany'))await render()}
 else if(k=='cfg'){if(res(await api('PUT','/api/admin/config',v),'Zapisano konfigurację'))await render()}
 else if(k=='reading'){if(res(await api('POST','/api/device/readings',{t:+v.t,h:+v.h},{'X-Api-Key':d.key}),'Odczyt wysłany'))await render()}});
(async()=>{const r=await api('GET','/api/me');if(r.ok)me=r.data;await render()})();
</script></body></html>
